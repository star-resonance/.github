# Reusable: exports an organization Project to STATUS.md on the caller's `status` branch.
# Cloud sessions cannot reach the Project API; they read this file instead:
#   git fetch origin status && git show origin/status:STATUS.md
# Called from a repository's own project-snapshot.yml (on a schedule, and by workflow_dispatch
# when a session needs fresh state), whose calling job grants `contents: write`. The Project
# belongs to the caller's organization, where its bridge App is installed: each organization
# has its own App, its key held only there.
#
# Needs, as organization (or caller repository) settings:
#   vars.PROJECT_NUMBER           the Project's number
#   vars.BRIDGE_APP_CLIENT_ID     client ID of the bridge GitHub App
#   secrets.BRIDGE_APP_PRIVATE_KEY  its private key; callers pass it by name
#
# STATUS.md holds issue titles, so it is published only to the caller's own branch; the job
# log prints a line count, never the file.
name: Project snapshot (reusable)

on:
  workflow_call:
    secrets:
      BRIDGE_APP_PRIVATE_KEY:
        required: false
        description: The bridge GitHub App's private key (see above)

permissions: {}

jobs:
  snapshot:
    name: export Project to STATUS.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push the generated `status` branch
    concurrency:
      group: project-snapshot-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the bridge script
        uses: actions/checkout@v7
        with:
          repository: star-resonance/.github
          ref: main
          path: .bridge
          persist-credentials: false

      - name: Get a Project token from the bridge App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: read
          permission-issues: read
          permission-pull-requests: read

      - name: Export
        env:
          PROJECT_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: python3 .bridge/scripts/project_bridge.py snapshot --out "$RUNNER_TEMP/STATUS.md"

      - name: Publish to the status branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/status-branch"
          mkdir -p "$out" && cd "$out"
          git init -q -b status
          cp "$RUNNER_TEMP/STATUS.md" STATUS.md
          git add STATUS.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Project snapshot"
          # One generated commit, replaced each run: the branch is a view, not history.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" status
          echo "published $(wc -l < STATUS.md) lines to the status branch" >> "$GITHUB_STEP_SUMMARY"
