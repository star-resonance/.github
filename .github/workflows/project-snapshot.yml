# Reusable: exports the star-resonance organization Project ("Resonance") to STATUS.md on the
# calling repository's `status` branch. Cloud sessions cannot reach the Project API; they read
# this file instead:
#   git fetch origin status && git show origin/status:STATUS.md
# Each caller's project-snapshot.yml decides when it runs (a schedule, workflow_dispatch, after a
# Project sync or set) and calls this.
#
# Needs vars.PROJECT_NUMBER, vars.BRIDGE_APP_CLIENT_ID and secrets.BRIDGE_APP_PRIVATE_KEY (passed by
# name), and `contents: write` granted by the calling job to push the `status` branch.
name: Project snapshot (reusable)

on:
  workflow_call:
    secrets:
      BRIDGE_APP_PRIVATE_KEY:
        required: false
        description: The bridge GitHub App's private key

permissions: {}

jobs:
  snapshot:
    name: export Project to STATUS.md
    if: vars.PROJECT_NUMBER != ''  # dormant until the Project is set up
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push the generated `status` branch
    # One run at a time per repository; a burst of triggers leaves one pending run, which reads
    # the Project after the last change.
    concurrency:
      group: project-snapshot-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the bridge script
        uses: actions/checkout@v7
        with:
          repository: star-resonance/.github
          ref: main
          path: .bridge
          persist-credentials: false

      - name: Get a Project token from the bridge App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: read
          permission-issues: read
          permission-pull-requests: read

      - name: Export
        env:
          PROJECT_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: python3 .bridge/scripts/project_bridge.py snapshot --out "$RUNNER_TEMP/STATUS.md"

      - name: Publish to the status branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/status-branch"
          mkdir -p "$out" && cd "$out"
          git init -q -b status
          cp "$RUNNER_TEMP/STATUS.md" STATUS.md
          git add STATUS.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Project snapshot"
          # One generated commit, replaced each run: the branch is a view, not history.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" status
          echo "published $(wc -l < STATUS.md) lines to the status branch" >> "$GITHUB_STEP_SUMMARY"
