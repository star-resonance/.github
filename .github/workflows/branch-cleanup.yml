# Reusable, and runs here: deletes the `claude/*` branches that outlived their work, a merged
# PR's branch still at that PR's head commit (ADR-053), and the `gate/<type>/<task>` branches
# of a task no branch or open PR has any more (app's ADR-063). scripts/branch_cleanup.py
# decides; it is checked out from this repository's main, never from a PR. Whatever it
# prints, this workflow deletes only `claude/` and `gate/` names.
# Auto-merge deletes the branches it merges; this catches the PRs Kade merges by hand (every
# PR here, and drafts and workflow PRs in resonance-stream and resonance-lab). Callers run it
# when a PR closes, daily, and by hand, like this repository's own triggers below. A merge
# made with GITHUB_TOKEN starts no `pull_request` run, so the daily sweep catches anything
# missed. ADR numbers are Stella Rain's; star-resonance has no `gate/` branches yet.
# `runs-on` lets a private caller pick its own runner; here and by default, ubuntu-latest.
# A copy of stella-rain/.github's workflow at commit b68a250; a fix made in one copy is
# ported to the other by hand.
name: Branch cleanup

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner as JSON, a label or a list of labels (default "ubuntu-latest")
        type: string
        required: false
        default: '"ubuntu-latest"'
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: delete merged claude and leftover gate branches
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write       # delete branches
      pull-requests: read   # list the PRs
    concurrency:
      group: branch-cleanup-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the cleanup script
        uses: actions/checkout@v7
        with:
          repository: star-resonance/.github
          ref: main
          path: .bridge
          persist-credentials: false

      - name: Delete the branches the script names
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" \
            --jq '.[] | {name, sha: .commit.sha}' | jq -s . > "$RUNNER_TEMP/branches.json"
          gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" \
            --jq '.[] | {ref: .head.ref, sha: .head.sha, repo: .head.repo.full_name, state, merged: (.merged_at != null)}' \
            | jq -s . > "$RUNNER_TEMP/prs.json"
          python3 .bridge/scripts/branch_cleanup.py \
            "$RUNNER_TEMP/branches.json" "$RUNNER_TEMP/prs.json" "$REPO" > "$RUNNER_TEMP/delete.txt"
          failed=0
          while IFS= read -r name; do
            case "$name" in
              claude/*|gate/*)
                if gh api -X DELETE "repos/$REPO/git/refs/heads/$name"; then
                  echo "- deleted \`$name\`" | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "- could not delete \`$name\`" | tee -a "$GITHUB_STEP_SUMMARY"
                  failed=1
                fi ;;
              *) echo "not a claude/ or gate/ branch; leaving $name" ;;
            esac
          done < "$RUNNER_TEMP/delete.txt"
          if [ ! -s "$RUNNER_TEMP/delete.txt" ]; then echo "Nothing to delete." >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$failed"
