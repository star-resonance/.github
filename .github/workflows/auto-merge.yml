# Reusable: merges a pull request from a `claude/*` branch into main once every check on its
# latest commit is green, then deletes the branch. Called by resonance-stream's and
# resonance-lab's auto-merge.yml on `workflow_run` (completed) of each of their checks; the
# run that finds the last check green merges. Anything else is left for a person: a failed or
# cancelled check, another branch prefix, a fork, a stale run, a pull request into any other
# branch, a draft, and a pull request that changes `.github/workflows/` (or a caller's
# `protected` path) or whose file list cannot be read whole.
# `require` names checks that must have succeeded: with several workflows starting this one,
# the last to finish may be the only one started yet, and a check not started yet must not
# count as green. Name only checks that run on every pull request into main; one that is
# skipped or path-filtered never succeeds, and the PR then waits for Kade.
# A merge made with GITHUB_TOKEN does not apply closing keywords (`Closes #N`), so after
# merging it closes the PR's closing issues in the same repository itself.
# `workflow_run` workflows are read from the caller's default branch, so a caller's
# auto-merge.yml takes effect once it is on main. Merges use the caller's GITHUB_TOKEN,
# so they start no `push` run on main; the pull request's own runs are the gate.
# The output `merged` is `true` once this run merged the PR: a caller that needs a run on main
# after a merge (resonance-stream re-saves its build cache) starts it in a job of its own.
# `runs-on` lets a private caller pick its own runner; here and by default, ubuntu-latest.
# A copy of stella-rain/.github's workflow at commit b68a250, plus the `merged` output; a fix
# made in one copy is ported to the other by hand.
name: Auto-merge (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner as JSON, a label or a list of labels (default "ubuntu-latest")
        type: string
        required: false
        default: '"ubuntu-latest"'
      require:
        description: Check run names that must have succeeded, one per line (default none)
        type: string
        required: false
        default: ""
      protected:
        description: >
          Paths left to Kade besides .github/workflows/, one per line; a path ending in /
          is a directory (default none)
        type: string
        required: false
        default: ""
    outputs:
      merged:
        description: '"true" when this run merged the pull request'
        value: ${{ jobs.merge.outputs.merged }}

permissions: {}

jobs:
  merge:
    name: merge when every check is green
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write       # merge, delete the branch
      pull-requests: write  # merge
      issues: write         # close the PR's closing issues
      checks: read          # the head commit's check runs
      statuses: read        # the head commit's commit statuses
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    concurrency:
      group: auto-merge-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out the gate script
        uses: actions/checkout@v7
        with:
          repository: star-resonance/.github
          ref: main
          path: .bridge
          persist-credentials: false

      - name: Merge if every check is green
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRE: ${{ inputs.require }}
          PROTECTED: ${{ inputs.protected }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
                 --json number,headRefOid --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then echo "no open PR from $BRANCH into main"; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          # The green run must be for the PR's latest commit, not an older push.
          if [ "$head" != "$RUN_SHA" ]; then echo "run is for $RUN_SHA, PR head is $head; waiting for its runs"; exit 0; fi
          gh api --paginate "repos/$REPO/commits/$RUN_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion}' | jq -s . > "$RUNNER_TEMP/check-runs.json"
          gh api "repos/$REPO/commits/$RUN_SHA/status" \
            --jq '{state, total_count}' > "$RUNNER_TEMP/status.json"
          # Drafts and PRs that change the workflows or a protected path go to Kade.
          gh api "repos/$REPO/pulls/$number" --jq '{draft, changed_files}' > "$RUNNER_TEMP/pr.json"
          gh api --paginate "repos/$REPO/pulls/$number/files?per_page=100" \
            --jq '.[] | {filename, previous_filename}' | jq -s . > "$RUNNER_TEMP/files.json"
          verdict=$(python3 .bridge/scripts/auto_merge_gate.py --require "$REQUIRE" --protect "$PROTECTED" \
                      --pr "$RUNNER_TEMP/pr.json" --files "$RUNNER_TEMP/files.json" \
                      "$RUNNER_TEMP/check-runs.json" "$RUNNER_TEMP/status.json")
          echo "PR #$number at $RUN_SHA: $verdict"
          if [ "$verdict" != merge ]; then exit 0; fi
          # --match-head-commit refuses the merge if a push landed since the checks were read.
          gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$RUN_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          # Delete only a claude/* branch, and never anything else.
          case "$BRANCH" in
            claude/*) gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" ;;
            *) echo "not a claude/* branch; leaving $BRANCH" ;;
          esac
          gh pr view "$number" --repo "$REPO" --json closingIssuesReferences \
            --jq .closingIssuesReferences > "$RUNNER_TEMP/closing.json"
          for issue in $(python3 .bridge/scripts/auto_merge_gate.py --issues-to-close "$RUNNER_TEMP/closing.json" "$REPO"); do
            gh issue close "$issue" --repo "$REPO" --reason completed --comment "Closed by #$number (auto-merge)."
          done
